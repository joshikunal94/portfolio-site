AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Static site hosting: private S3 bucket (no public access, no S3 website endpoint)
  served ONLY through CloudFront via Origin Access Control (OAC). Includes a
  least-privilege bucket policy scoped to this distribution, a Response Headers
  Policy (CSP/HSTS/nosniff/referrer/frame/permissions), an explicit cache policy,
  and a viewer-request CloudFront Function that rewrites directory paths to
  index.html (required because a REST/OAC origin does NOT auto-serve index docs
  for sub-paths the way the legacy S3 *website* endpoint did).
  Custom domain(s) (DomainNames + ACM cert in us-east-1) are OPTIONAL and gated by
  parameters, so the stack deploys standalone on the *.cloudfront.net domain first.
  DNS is intentionally OUT of this stack (it often lives in a different account /
  zone / permission boundary): after deploy, alias your domain to the
  DistributionDomainName output. See infra/README.md.
  Deploy this stack in us-east-1 (CloudFront + ACM-for-CloudFront requirement).

# ---------------------------------------------------------------------------
Parameters:
  BucketName:
    Type: String
    Default: ""
    Description: >-
      Optional explicit S3 bucket name (must be globally unique). Leave blank to
      let CloudFormation auto-name it (recommended for a private origin bucket).

  DomainNames:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Optional custom domain(s), comma-separated — e.g. "joshikunal.com,www.joshikunal.com"
      to serve both the apex and www. Leave blank to serve on the default *.cloudfront.net
      domain. If set, AcmCertificateArn is required AND that cert MUST cover every name
      listed here (a cert for the apex alone will NOT validate www — request a cert with
      both, or an apex + "*.apex" wildcard, before deploying).

  AcmCertificateArn:
    Type: String
    Default: ""
    Description: >-
      Optional ACM certificate ARN (MUST be in us-east-1) covering ALL names in DomainNames.
      Required only when DomainNames is set. DNS records are NOT managed here — create an
      alias/CNAME for EACH name separately against the DistributionDomainName output.

  ContentSecurityPolicy:
    Type: String
    # Default is intentionally strict but hash-free; the deploy script overrides
    # this with the exact script-src hashes produced by scripts/gen-csp.mjs so the
    # single source of truth for CSP stays in the build, not hand-maintained here.
    Default: >-
      default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
      img-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none';
      base-uri 'self'; form-action 'self'
    Description: >-
      Full Content-Security-Policy header value. Overridden at deploy time from
      the build's generated hashes (see infra/deploy.sh). Change the DEFAULT only
      if you are not using the deploy script.

  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: >-
      CloudFront price class. PriceClass_100 (NA + EU edges) is the cheapest and
      fine for a personal site; raise for global low-latency.

# ---------------------------------------------------------------------------
Conditions:
  HasBucketName: !Not [!Equals [!Ref BucketName, ""]]
  # DomainNames defaults to [""]; the first element is "" only when no domain was passed.
  HasDomain: !Not [!Equals [!Select [0, !Ref DomainNames], ""]]
  HasCert: !Not [!Equals [!Ref AcmCertificateArn, ""]]
  UseCustomDomain: !And [!Condition HasDomain, !Condition HasCert]

# ---------------------------------------------------------------------------
Resources:

  # --- Private origin bucket: no public access, no website endpoint ---
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain          # don't nuke content on stack delete; flip to Delete if you prefer
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [HasBucketName, !Ref BucketName, !Ref "AWS::NoValue"]
      # No WebsiteConfiguration on purpose — served via CloudFront REST origin only.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled             # cheap rollback / accidental-overwrite protection
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced   # disables ACLs entirely (modern default)

  # --- Bucket policy: ONLY this CloudFront distribution may read (via OAC) ---
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                # Scopes access to exactly this distribution — not "any CloudFront".
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # --- Origin Access Control (OAC) — modern replacement for OAI ---
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: OAC for the private static-site bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # --- Security headers applied to every response at the edge ---
  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: CSP/HSTS/nosniff/referrer/frame + Permissions-Policy for the static site
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Ref ContentSecurityPolicy
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
          ContentTypeOptions:
            Override: true            # X-Content-Type-Options: nosniff
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: no-referrer
        CustomHeadersConfig:
          Items:
            # Permissions-Policy has no first-class field; set it explicitly.
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=()"
              Override: true

  # --- Explicit cache policy (long-cache immutable assets; HTML handled by app) ---
  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-cache"
        Comment: Compresses; caches by URL only (no cookies/query/headers) for a static export
        DefaultTTL: 86400        # 1 day
        MinTTL: 0
        MaxTTL: 31536000         # 1 year (fingerprinted _next assets are immutable)
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # --- Viewer-request function: rewrite directory paths to index.html ---
  # Required for OAC/REST origin: unlike the legacy S3 *website* endpoint,
  # CloudFront will NOT map "/" -> /index.html or "/path/" -> /path/index.html by itself.
  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-url-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Append index.html for directory-style requests
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') <= uri.lastIndexOf('/')) {
            // No file extension in the last path segment -> treat as a directory.
            request.uri = uri + '/index.html';
          }
          return request;
        }

  # --- The distribution ---
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} static site"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Aliases: !If [UseCustomDomain, !Ref DomainNames, !Ref "AWS::NoValue"]
        Origins:
          - Id: s3-origin
            # REST endpoint (RegionalDomainName), NOT the *.s3-website-* endpoint.
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""   # empty => OAC path (not legacy OAI)
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: !Ref CachePolicy
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          # SPA-style + friendly 404: serve the app's 404 page.
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
        ViewerCertificate: !If
          - UseCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

# ---------------------------------------------------------------------------
Outputs:
  BucketName:
    Description: Name of the private origin bucket (sync your out/ folder here)
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID (use for cache invalidations)
    Value: !Ref Distribution
  DistributionDomainName:
    Description: >-
      CloudFront domain — point your DNS alias/CNAME here (DNS is managed OUTSIDE this stack).
    Value: !GetAtt Distribution.DomainName
  CloudFrontHostedZoneId:
    Description: >-
      Fixed CloudFront hosted-zone ID for Route 53 ALIAS records (same in every region).
      Use with DistributionDomainName when creating the apex/subdomain alias externally.
    Value: Z2FDTNDATAQYW2
  ConfiguredDomainNames:
    Description: All custom domains this distribution answers for (empty if none). Create DNS for EACH.
    Value: !Join [",", !Ref DomainNames]
  SiteUrl:
    Description: Effective site URL (primary = first name in DomainNames)
    Value: !If
      - UseCustomDomain
      - !Sub
        - "https://${First}"
        - First: !Select [0, !Ref DomainNames]
      - !Sub "https://${Distribution.DomainName}"
